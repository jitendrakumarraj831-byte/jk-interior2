<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 200" role="img" aria-label="JK Interior — Interior &amp; False Ceiling Solutions">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c6f1e"/>
      <stop offset="0.45" stop-color="#e7cd83"/>
      <stop offset="0.78" stop-color="#c69a34"/>
      <stop offset="1" stop-color="#a2761f"/>
    </linearGradient>
    <linearGradient id="goldArm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b07f22"/>
      <stop offset="0.5" stop-color="#e7cd83"/>
      <stop offset="1" stop-color="#c69a34"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fae54"/>
      <stop offset="1" stop-color="#2f6b2c"/>
    </linearGradient>
  </defs>

  <!-- ===== EMBLEM ===== -->
  <g>
    <!-- gold sweeping ring encircling the mark, open on the right with a tail -->
    <path d="M180,68 A92,66 0 1 0 180,144 Q186,158 212,150" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>

    <!-- roof -->
    <path d="M20,96 L104,30 L188,96 L172,96 L104,52 L36,96 Z" fill="#242c3b"/>
    <!-- gold under-roof trim -->
    <path d="M38,99 L104,55 L170,99" fill="none" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- chimney -->
    <rect x="128" y="44" width="9" height="22" rx="2" fill="#242c3b"/>

    <!-- gable window (left slope) -->
    <rect x="58" y="60" width="19" height="19" rx="2" fill="#242c3b"/>
    <line x1="67.5" y1="60" x2="67.5" y2="79" stroke="url(#gold)" stroke-width="2"/>
    <line x1="58" y1="69.5" x2="77" y2="69.5" stroke="url(#gold)" stroke-width="2"/>

    <!-- monogram: J (dark serif) -->
    <text x="50" y="156" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="98" fill="#242c3b">J</text>

    <!-- monogram: K built from strokes (gold upper arm = roof slope) -->
    <rect x="104" y="92" width="15" height="64" rx="3" fill="#242c3b"/>
    <path d="M114,123 L150,94" fill="none" stroke="url(#goldArm)" stroke-width="16" stroke-linecap="round"/>
    <path d="M114,125 L147,156" fill="none" stroke="#242c3b" stroke-width="15" stroke-linecap="round"/>

    <!-- green leaf sprig at the base -->
    <path d="M150,170 Q154,156 161,146" fill="none" stroke="url(#leaf)" stroke-width="3" stroke-linecap="round"/>
    <path d="M161,146 Q173,139 179,149 Q169,157 161,150 Z" fill="url(#leaf)"/>
    <path d="M153,157 Q165,151 171,161 Q161,167 153,160 Z" fill="url(#leaf)"/>
  </g>

  <!-- ===== DIVIDER ===== -->
  <line x1="250" y1="50" x2="250" y2="150" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== WORDMARK ===== -->
  <g>
    <text x="278" y="118" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="76" fill="#232c3a" letter-spacing="-2">JK</text>
    <text x="400" y="116" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="64" fill="#2b3442" letter-spacing="4">INTERIOR</text>

    <!-- tagline with gold end-dashes -->
    <line x1="322" y1="150" x2="344" y2="150" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="352" y="156" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="16" fill="#6b7280" letter-spacing="2.2">INTERIOR &amp; FALSE CEILING SOLUTIONS</text>
    <line x1="726" y1="150" x2="748" y2="150" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
