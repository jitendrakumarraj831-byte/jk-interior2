<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- JK Interior brand mark: gold house roof over charcoal JK monogram -->
  <rect width="64" height="64" rx="12" fill="#ffffff"/>
  <!-- Roof -->
  <path d="M10 30 L32 13 L54 30" stroke="#1f2a37" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M13 31 L32 16.5 L51 31" stroke="#c9a227" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- Roof window -->
  <rect x="29.2" y="21.6" width="5.6" height="5.6" rx="1" fill="#1f2a37"/>
  <!-- JK monogram -->
  <text x="32" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="800" fill="#1f2a37" letter-spacing="-1">JK</text>
  <!-- Gold swoosh -->
  <path d="M12 55 Q32 48 52 55" stroke="#c9a227" stroke-width="2.6" stroke-linecap="round" fill="none"/>
</svg>
