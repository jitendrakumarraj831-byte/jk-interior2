<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="author" content="JK Interior" />
    <!-- Matches the charcoal utility strip at the very top of every page, so the
         browser chrome blends into it. (It was #0D9488 — a teal from an earlier
         palette that appears nowhere on the site.) -->
    <meta name="theme-color" content="#141c26" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Canonical, title, description, Open Graph and JSON-LD are set per route by
         SeoHead (react-helmet-async) and baked into static HTML by scripts/prerender.ts.
         The tags below are only the generic fallback. -->

    <!-- Self-hosted fonts (see public/fonts/fonts.css) — avoids a render-blocking
         round trip to fonts.googleapis.com/fonts.gstatic.com on every first visit.
         Both families are preloaded: Playfair Display is used for every h1-h4 (see
         index.css), so loading it late causes a late font swap and a large CLS hit. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high" />
    <link rel="preload" href="/fonts/playfair-display-normal-latin.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high" />
    <!-- These @font-face rules are inlined rather than linked from
         /fonts/fonts.css: a stylesheet <link> is render-blocking, so linking
         ~1.5 kB of @font-face cost a full request round trip before first
         paint on every cold load. public/fonts/fonts.css is kept in sync as
         the readable reference copy. -->
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/inter-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Playfair Display';
        font-style: normal;
        font-weight: 700 800;
        font-display: swap;
        src: url('/fonts/playfair-display-normal-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Playfair Display';
        font-style: italic;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/playfair-display-italic-700-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>

    <!-- Critical resources (preload for LCP performance) -->
    <!-- The hero room photo is the LCP element on the home route only — Hero
         (src/components/hero.tsx) is not rendered by any other page. Its
         preload hints are therefore emitted route-scoped, by Hero itself via
         react-helmet-async (same mechanism as SeoHead), and captured into the
         prerendered static HTML for "/" by the prerender script. Preloading
         it here unconditionally used to compete with each *other* route's own
         critical resources (fonts, its own LCP element) for bandwidth and
         actively hurt mobile LCP everywhere except home. Gallery images stay
         out of this entirely — they're below the fold inside a lazy-loaded
         component and must never be preloaded. -->

    <title>JK Interior | False Ceiling &amp; Interior Contractor in Forbesganj, Araria</title>
    <meta name="description" content="Gypsum, PVC and grid false ceilings, partition walls, WPC wall panels, UV marble sheets and TV units in Forbesganj, Araria and nearby. Free site visit." />

    <!-- Open Graph (static fallback for crawlers) -->
    <meta property="og:title" content="JK Interior | False Ceiling &amp; Interior Contractor in Forbesganj, Araria" />
    <meta property="og:description" content="Gypsum, PVC and grid false ceilings, partition walls, WPC wall panels, UV marble sheets and TV units in Forbesganj, Araria and nearby. Free site visit." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.jkinterior.online/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:site_name" content="JK Interior" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JK Interior | False Ceiling &amp; Interior Contractor in Forbesganj, Araria" />
    <meta name="twitter:description" content="Gypsum, PVC and grid false ceilings, partition walls, WPC wall panels, UV marble sheets and TV units in Forbesganj, Araria and nearby. Free site visit." />
    <meta name="twitter:image" content="https://www.jkinterior.online/opengraph.jpg" />

  </head>
  <body>
    <div id="root"></div>
    <script>
      /*
       * The AI assistant launcher ships in the prerendered HTML and is painted
       * by CSS alone, well before the React bundle has downloaded and hydrated.
       * Without this, a tap in that window would land on a button with no
       * handler attached yet and simply do nothing. Capture it here — App reads
       * the flag as soon as it mounts and opens the assistant straight away.
       */
      (function () {
        window.__jkChatWanted = false
        document.addEventListener(
          "click",
          function (e) {
            var t = e.target
            if (t && t.closest && t.closest("[data-jk-launcher]")) window.__jkChatWanted = true
          },
          true
        )
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
