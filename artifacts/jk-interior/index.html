    <!-- Self-hosted fonts (see public/fonts/fonts.css) — avoids a render-blocking
         round trip to fonts.googleapis.com/fonts.gstatic.com on every first visit.
         Both families are preloaded: Playfair Display is used for every h1-h4 (see
         index.css), so loading it late causes a late font swap and a large CLS hit. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high" />
    <link rel="preload" href="/fonts/playfair-display-normal-latin.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high" />
    <!-- These @font-face rules are inlined rather than linked from
         /fonts/fonts.css: a stylesheet <link> is render-blocking, so linking
         ~1.5 kB of @font-face cost a full request round trip before first
         paint on every cold load. public/fonts/fonts.css is kept in sync as
         the readable reference copy. -->
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/inter-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Playfair Display';
        font-style: normal;
        font-weight: 700 800;
        font-display: swap;
        src: url('/fonts/playfair-display-normal-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Playfair Display';
        font-style: italic;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/playfair-display-italic-700-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>

    <!-- Critical resources (preload for LCP performance) -->

         critical resources (fonts, its own LCP element) for bandwidth and
         actively hurt mobile LCP everywhere except home. Gallery images stay
         out of this entirely — they're below the fold inside a lazy-loaded

  <body>
    <div id="root"></div>
    <script>
      /*
       * The AI assistant launcher ships in the prerendered HTML and is painted
       * by CSS alone, well before the React bundle has downloaded and hydrated.
       * Without this, a tap in that window would land on a button with no
       * handler attached yet and simply do nothing. Capture it here — App reads
       * the flag as soon as it mounts and opens the assistant straight away.
       */
      (function () {
        window.__jkChatWanted = false
        document.addEventListener(
          "click",
          function (e) {
            var t = e.target
            if (t && t.closest && t.closest("[data-jk-launcher]")) window.__jkChatWanted = true
          },
          true
        )
      })()
    </script>
